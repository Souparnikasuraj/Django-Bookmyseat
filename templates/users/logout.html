{% extends "users/basic.html" %}

{% block content %}

<div class="logout-page">
    <div class="logout-card">
        <div class="logout-icon">
            <i class="fas fa-check-circle"></i>
        </div>

        <h2>You have been logged out!</h2>

        <p>Thank you for visiting BookMySeat.</p>

        <a href="{% url 'login' %}" class="login-link">
            <i class="fas fa-sign-in-alt"></i>
            Log in again
        </a>
    </div>
</div>

<style>
    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
    }

    .logout-page,
    .logout-page *,
    .logout-page *::before,
    .logout-page *::after {
        box-sizing: border-box;
    }

    .logout-page {
        width: 100vw !important;
        max-width: 100vw !important;
        position: relative;
        left: auto;
        margin-left: calc(50% - 50vw) !important;
        margin-bottom: 0 !important;

        /* Use content height so the footer follows the message without a blank gap. */
        min-height: 0;
        padding: 36px 16px;

        display: flex;
        align-items: center;
        justify-content: center;

        text-align: center;
        background: #f4f5fc;
    }

    .logout-card {
        width: 100%;
        max-width: 460px;
        padding: 38px 28px;
        background: #fff;
        border: 1px solid #e9e9f4;
        border-radius: 18px;
        box-shadow: 0 12px 35px rgba(36, 35, 80, 0.09);
    }

    .logout-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
    }

    .logout-icon i {
        font-size: 44px;
        color: #6254df;
    }

    .logout-card h2 {
        color: #25253d;
        font-size: 25px;
        line-height: 1.3;
        margin: 0 0 10px;
    }

    .logout-card p {
        color: #85869e;
        font-size: 14px;
        line-height: 1.6;
        margin: 0 0 22px;
    }

    .login-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 11px 23px;
        background: linear-gradient(110deg, #5145cd, #7665f6);
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 5px 13px rgba(81, 69, 205, 0.20);
        transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .login-link:hover {
        background: #5145cd;
        color: #fff;
        text-decoration: none;
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(81, 69, 205, 0.25);
    }

    .login-link:focus-visible {
        outline: 3px solid rgba(98, 84, 223, 0.35);
        outline-offset: 3px;
    }

    @media (max-width: 480px) {
        .logout-page {
            padding: 24px 14px;
        }

        .logout-card {
            padding: 30px 20px;
            border-radius: 15px;
        }

        .logout-card h2 {
            font-size: 22px;
        }

        .logout-icon i {
            font-size: 40px;
        }
    }
</style>

{% endblock %}
