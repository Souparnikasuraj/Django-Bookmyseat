{% extends "users/basic.html" %}

{% block content %}

<style>

/* =========================================================
   PAGE
========================================================= */

.edit-review-page {
    width: 100vw;
    margin-left: calc(50% - 50vw);
    background: #f7f7f8;
    min-height: 100vh;
    padding: 40px 10% 60px;
    box-sizing: border-box;
}

.edit-review-container {
    max-width: 1200px;
    margin: auto;
    padding: 0 20px;
}


/* =========================================================
   REVIEW SECTION
========================================================= */

.edit-review-section {
    background: white;

    padding: 35px;

    border-radius: 18px;

    border: 1px solid #e9e9e9;

    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);

    max-width: 800px;

    margin: 30px auto;
}


/* =========================================================
   HEADER
========================================================= */

.edit-review-header {
    margin-bottom: 30px;

    border-bottom: 1px solid #eeeeee;

    padding-bottom: 20px;
}

.edit-review-title {
    font-size: 32px;

    font-weight: 700;

    color: #202124;

    margin-bottom: 10px;
}

.movie-name {
    color: #e91e63;
}

.edit-review-subtitle {
    color: #777;

    font-size: 15px;

    margin: 0;
}


/* =========================================================
   FORM
========================================================= */

.edit-review-form {
    margin-top: 25px;
}

.edit-review-form p {
    margin-bottom: 22px;
}

.edit-review-form label {
    display: block;

    margin-bottom: 8px;

    font-size: 14px;

    font-weight: 600;

    color: #333;
}

.edit-review-form input,
.edit-review-form select,
.edit-review-form textarea {
    width: 100%;

    padding: 12px 14px;

    border: 1px solid #ddd;

    border-radius: 8px;

    font-size: 15px;

    color: #333;

    background: #fff;

    box-sizing: border-box;

    transition: all 0.2s ease;
}

.edit-review-form textarea {
    min-height: 140px;

    resize: vertical;
}

.edit-review-form input:focus,
.edit-review-form select:focus,
.edit-review-form textarea:focus {
    outline: none;

    border-color: #e91e63;

    box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.1);
}


/* =========================================================
   ERROR MESSAGES
========================================================= */

.edit-review-form .errorlist {
    color: #dc3545;

    font-size: 13px;

    margin: 5px 0 8px;

    padding-left: 18px;
}


/* =========================================================
   BUTTONS
========================================================= */

.review-buttons {
    display: flex;

    gap: 12px;

    margin-top: 30px;
}

.update-review-btn,
.cancel-review-btn {
    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding: 12px 22px;

    border-radius: 8px;

    font-size: 15px;

    font-weight: 600;

    text-decoration: none;

    cursor: pointer;

    transition: all 0.25s ease;
}

.update-review-btn {
    border: none;

    background: #e91e63;

    color: white;
}

.update-review-btn:hover {
    background: #d81b60;

    color: white;

    transform: translateY(-2px);

    box-shadow: 0 6px 15px rgba(233, 30, 99, 0.25);
}

.cancel-review-btn {
    border: 1px solid #ddd;

    background: #f8f9fa;

    color: #444;
}

.cancel-review-btn:hover {
    background: #343a40;

    border-color: #343a40;

    color: white;

    text-decoration: none;

    transform: translateY(-2px);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    .edit-review-page {
        padding: 30px 5% 50px;
    }

    .edit-review-section {
        padding: 30px;
    }

    .edit-review-title {
        font-size: 28px;
    }
}


@media (max-width: 600px) {

    .edit-review-page {
        padding: 20px 0 40px;
    }

    .edit-review-container {
        padding: 0 12px;
    }

    .edit-review-section {
        padding: 22px;

        border-radius: 12px;

        margin: 20px auto;
    }

    .edit-review-title {
        font-size: 25px;
    }

    .review-buttons {
        flex-direction: column;
    }

    .update-review-btn,
    .cancel-review-btn {
        width: 100%;

        box-sizing: border-box;
    }
}

</style>


<div class="edit-review-page">

    <div class="edit-review-container">

        <div class="edit-review-section">


            <!-- =================================================
                 HEADER
            ================================================== -->

            <div class="edit-review-header">

                <h1 class="edit-review-title">

                    Edit Review

                    <span class="movie-name">
                        {{ movie.name }}
                    </span>

                </h1>

                <p class="edit-review-subtitle">
                    Update your rating and review for this movie.
                </p>

            </div>


            <!-- =================================================
                 FORM
            ================================================== -->

            <form method="POST" class="edit-review-form">

                {% csrf_token %}

                {{ form.as_p }}


                <!-- Buttons -->

                <div class="review-buttons">

                    <button
                        type="submit"
                        class="update-review-btn"
                    >
                        Update Review
                    </button>


                    <a
                        href="{% url 'movie_detail' movie.id %}"
                        class="cancel-review-btn"
                    >
                        Cancel
                    </a>

                </div>

            </form>


        </div>

    </div>

</div>

{% endblock %}
