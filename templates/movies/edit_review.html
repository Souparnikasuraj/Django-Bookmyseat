{% extends "users/basic.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card">
        <div class="card-body">

            <h2>Edit Review</h2>

            <h4>{{ movie.name }}</h4>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Update Review
                </button>

                <a href="{% url 'movie_detail' movie.id %}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </form>

        </div>
    </div>

</div>

{% endblock %}
